[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc-multimodal-demo"
version = "0.2.0"
description = "Auditable HCC multimodal research prototype with geometry and LLM safety gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "nibabel>=5.2,<6",
  "numpy>=1.26,<3",
  "pillow>=10,<13",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pydicom>=3,<4",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "types-pyyaml>=6,<7",
]
public-data = [
  "idc-index>=0.12,<1",
  "pydicom>=3,<4",
]
m3d = [
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
  "monai>=1.3,<2",
  "safetensors>=0.4,<1",
]

[project.scripts]
hcc-demo = "hcc_multimodal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hcc_multimodal = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["hcc_multimodal"]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "torch", "torch.*", "transformers", "transformers.*", "monai", "monai.*"]
ignore_missing_imports = true
