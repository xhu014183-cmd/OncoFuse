[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hcc-multimodal-demo"
version = "0.4.0"
description = "Auditable HCC multimodal research prototype with geometry and LLM safety gates"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "nibabel>=5.2,<6",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pillow>=10,<13",
  "pydicom>=3,<4",
  "pydantic>=2.8,<3",
  "pyyaml>=6,<7",
  "scipy>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "ruff>=0.5,<1",
  "types-pyyaml>=6,<7",
]
public-data = [
  "idc-index>=0.12,<1",
]
# Reserved: OCR ingestion is not yet wired to a concrete dependency.
ocr = []
# The LLM client uses the standard library (urllib), so no extra dependency is needed.
llm = []
registration = [
  "SimpleITK>=2.3,<3",
]
imaging-ai = [
  "torch>=2.2,<3",
  "monai>=1.3,<2",
]
# m3d is a superset of imaging-ai (adds transformers + safetensors) for M3D-LaMed
# inference; kept separate to avoid pulling transformers into plain imaging-ai use.
m3d = [
  "torch>=2.2,<3",
  "transformers>=4.40,<5",
  "monai>=1.3,<2",
  "safetensors>=0.4,<1",
]

[project.scripts]
hcc-demo = "hcc_multimodal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hcc_multimodal = ["configs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
omit = [
  "*/multimodal_connector.py",
  "*/vlm_model.py",
  "*/vlm_skeleton_web.py",
  "*/vlm_training.py",
]
branch = true
source = ["hcc_multimodal"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.mypy]
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "torch", "torch.*", "transformers", "transformers.*", "monai", "monai.*", "SimpleITK", "SimpleITK.*", "idc_index", "idc_index.*", "nibabel", "nibabel.*"]
ignore_missing_imports = true
