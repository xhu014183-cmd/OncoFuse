name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Type check
        run: mypy src/hcc_multimodal
      - name: Test and coverage
        run: python -m pytest --cov=hcc_multimodal --cov-report=term-missing -q
      - name: Export public schemas
        run: hcc-demo export-schemas --output schema-output
      - name: Validate research contract templates
        run: |
          hcc-demo validate-json --type research-protocol --input examples/research_protocol.template.json
          hcc-demo validate-json --type research-cohort-manifest --input examples/research_manifest.template.json
          hcc-demo validate-json --type adjudication-set --input examples/adjudications.template.json
      - name: Run synthetic end-to-end demo
        run: hcc-demo run-demo --output demo-output
      - name: Validate end-to-end artifacts
        run: |
          hcc-demo validate-json --type imaging-evidence --input demo-output/followup_imaging_evidence.json
          hcc-demo validate-json --type lab-evidence --input demo-output/lab_evidence.json
          hcc-demo validate-json --type longitudinal-imaging-evidence --input demo-output/longitudinal_imaging_evidence.json
          hcc-demo validate-json --type clinical-verdict --input demo-output/clinical_verdict.json
          hcc-demo validate-json --type multimodal-case-evidence --input demo-output/multimodal_case_evidence.json
